<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warm and Calm · background v2</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1410; }
  body { display: grid; place-items: center; overflow: hidden; }
  /* The scene is always drawn at 1440×900 and scaled to fit the window */
  canvas { width: min(100vw, 160vh); aspect-ratio: 1440 / 900; display: block; }
</style>
</head>
<body>
<canvas id="scene" width="1440" height="900"></canvas>
<script>
/* ─────────────────────────────────────────────────────────────
   KNOBS: change these numbers to tune the look, then reload.
   ───────────────────────────────────────────────────────────── */
const SAND_DENSITY = 0.55; // 0 = clear air · 0.55 = in between · 0.85 = sun almost disappears
const WIND_SPEED   = 1.95; // 0.5 = half as fast · 2 = twice as fast (started at 1.0)
const GRAIN_AMOUNT = 0.05; // film grain strength (0 = none)

/* Warm and Calm background v2: an ochre sun inside a slow, billowing sandstorm.
   Everything is painted by a small program on the graphics card (a "shader"),
   once per pixel, every frame:
   base gradient → sun → two layers of swirling sand (far haze + nearer clouds) → grain. */

const canvas = document.getElementById('scene');
const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });

const vertexSrc = `
attribute vec2 pos;
void main() { gl_Position = vec4(pos, 0.0, 1.0); }`;

const fragmentSrc = `
precision highp float;
uniform float uTime;
uniform float uDensity;
uniform float uWind;
uniform float uGrain;
const vec2 RES = vec2(1440.0, 900.0);

/* ── cloudy noise: the building block for the sand ── */
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x),
             mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}
// "fbm": several layers of noise, each finer and fainter, giving a cloud-like texture
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
  for (int i = 0; i < 5; i++) { v += a * noise(p); p = rot * p * 2.03; a *= 0.5; }
  return v;
}
// Swirling sand: the noise is pushed around by more noise ("domain warping").
// Most of the motion is the shapes churning IN PLACE (evolve); only a slow drift moves them left.
float sand(vec2 uv, float t, float drift, float evolve, float swirl) {
  vec2 wind = vec2(t * drift, 0.0);               // slow drift right → left
  float e = t * evolve;                            // churning in place
  vec2 q = vec2(fbm(uv + wind + vec2(0.0, e)),
                fbm(uv + wind + vec2(5.2, 1.3) - vec2(e * 0.8, e)));
  vec2 r = vec2(fbm(uv + swirl * q + vec2(1.7, 9.2) + vec2(e * 1.2, -e * 0.6)),
                fbm(uv + swirl * q + vec2(8.3, 2.8) + vec2(-e, e * 1.1)));
  return fbm(uv + swirl * r + wind);
}

void main() {
  vec2 p = vec2(gl_FragCoord.x, RES.y - gl_FragCoord.y); // pixel position, top-left = 0,0
  float t = uTime * uWind;

  /* 1. Base gradient: sage-grey sky top left → toffee/rust bottom right */
  vec2 a = vec2(380.0, 0.0), b = vec2(1060.0, 900.0);
  float g = clamp(dot(p - a, b - a) / dot(b - a, b - a), 0.0, 1.0);
  vec3 c0 = vec3(207., 205., 194.) / 255.;
  vec3 c1 = vec3(198., 187., 166.) / 255.;
  vec3 c2 = vec3(164., 128.,  92.) / 255.;
  vec3 c3 = vec3(134.,  96.,  63.) / 255.;
  vec3 c4 = vec3(108.,  69.,  41.) / 255.;
  vec3 col = mix(c0, c1, smoothstep(0.00, 0.35, g));
  col = mix(col, c2, smoothstep(0.35, 0.58, g));
  col = mix(col, c3, smoothstep(0.58, 0.80, g));
  col = mix(col, c4, smoothstep(0.80, 1.00, g));

  /* 2. The sun: centered at 721,422, 760px wide. One long, gentle fade from
        deep ochre (#B87427) in the middle to pale sand (#E8C79B) at the rim. */
  float breathe = 1.0 + 0.018 * sin(uTime / 9.0 * 6.2832);
  float glow = 0.9 + 0.1 * sin(uTime / 26.0 * 6.2832 + 1.0);
  float d = length(p - vec2(721.0, 422.0)) / (380.0 * breathe);
  vec3 sunCore = vec3(184., 116., 39.) / 255.;
  vec3 sunRim  = vec3(232., 199., 155.) / 255.;
  vec3 sunCol = mix(sunCore, sunRim, smoothstep(0.0, 1.0, pow(d, 0.85)));
  float sunA = (1.0 - smoothstep(0.55, 1.1, d)) * glow;     // soft, wide edge
  col = mix(col, sunCol, sunA);
  float halo = (1.0 - smoothstep(0.8, 1.6, d)) * 0.25 * glow; // faint light around it
  col = mix(col, sunRim, halo);

  /* 3. Sand. Coordinates are stretched sideways a little: wind pulls clouds into long shapes */
  vec2 uv = p / RES.y * vec2(0.55, 1.0);
  // Both layers drift at about the same on-screen speed (~8px/s), so there's no "car window" depth effect
  float haze   = sand(uv * 1.3,                     t, 0.006, 0.030, 1.6); // far: big, soft
  float clouds = sand(uv * 2.4 + vec2(3.1, 7.7),   t, 0.012, 0.050, 2.4); // near: smaller, curlier

  float low = smoothstep(0.1, 1.0, p.y / RES.y);   // sand is thicker near the ground
  // the pale top-left sky gets a bit more sand, otherwise it looks empty there
  float topLeft = 1.0 - smoothstep(0.0, 0.75, length(p / RES - vec2(0.0, 0.0)));
  float dens = uDensity * (0.45 + 0.55 * low + 0.35 * topLeft) * (0.55 * smoothstep(0.25, 0.8, haze) + 0.75 * smoothstep(0.35, 0.85, clouds));
  // a thin constant veil keeps the sun covered as much as before; away from the sun it's thinner,
  // so some patches of sky stay clear and still
  float nearSun = 1.0 - smoothstep(0.9, 1.5, d);
  dens = clamp(dens + uDensity * mix(0.06, 0.18, nearSun), 0.0, 0.92);

  // sand color: pale and sunlit in thin parts, deeper ochre where it's thick and low
  vec3 sandLight = vec3(222., 199., 160.) / 255.;
  vec3 sandDeep  = vec3(170., 124.,  78.) / 255.;
  vec3 sandCol = mix(sandLight, sandDeep, clamp(0.35 * low + 0.6 * smoothstep(0.4, 0.9, clouds), 0.0, 1.0));
  // where the background is pale, pale sand disappears into it, so tint the sand
  // a little warmer/darker there. The background itself stays exactly the same.
  float bgLight = dot(col, vec3(0.299, 0.587, 0.114));
  sandCol = mix(sandCol, vec3(196., 162., 118.) / 255., smoothstep(0.66, 0.80, bgLight) * 0.6);
  col = mix(col, sandCol, dens);

  /* 4. Flying grains: a few sparse flecks drifting slowly, only where there's sand */
  vec2 fp = floor(vec2(p.x + uTime * uWind * 30.0, p.y + 6.0 * sin(p.x * 0.004 + uTime * 0.3)) / 2.0);
  float fleck = step(0.9992, hash(fp));
  col = mix(col, vec3(240., 225., 195.) / 255., fleck * 0.3 * clamp(dens * 2.0, 0.0, 1.0));

  /* 5. Film grain: completely still, fixed to the screen like paper texture.
        It's the steady anchor for the eye, so the frame never feels like it's moving. */
  col += (hash(floor(p)) - 0.5) * uGrain * 2.0;

  gl_FragColor = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vertexSrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fragmentSrc));
gl.linkProgram(prog);
gl.useProgram(prog);

// one rectangle covering the whole canvas
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const posLoc = gl.getAttribLocation(prog, 'pos');
gl.enableVertexAttribArray(posLoc);
gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

const uTime = gl.getUniformLocation(prog, 'uTime');
gl.uniform1f(gl.getUniformLocation(prog, 'uDensity'), SAND_DENSITY);
gl.uniform1f(gl.getUniformLocation(prog, 'uWind'), WIND_SPEED);
gl.uniform1f(gl.getUniformLocation(prog, 'uGrain'), GRAIN_AMOUNT);

// start a little way into the animation so the first frame already looks "settled"
const START = 40;
function frame(ms) {
  gl.uniform1f(uTime, START + ms / 1000);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// Respect "reduce motion" settings: show one still frame instead of animating
if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
  frame(0);
} else {
  const loop = (ms) => { frame(ms); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
